<body>
  <script>
    // Restore the route saved by public/404.html when GitHub Pages serves a deep link.
    const redirect = new URLSearchParams(window.location.search).get('__spa_redirect');
    const base = '%BASE_URL%';
    if (redirect && redirect.startsWith(base) && !redirect.startsWith('//')) {
      window.history.replaceState(null, '', redirect);
    }
  </script>
